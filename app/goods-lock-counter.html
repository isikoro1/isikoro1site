<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>グッズロックカウンター</title>
<style> 
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: radial-gradient(circle at center, #2b2b2b 0%, #111 70%); color: #fff; }

body { position: relative; }

.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; cursor: pointer; user-select: none; overflow: hidden; background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 50%); }

.screen::before { content: ""; position: absolute; inset: 0; background: rgba(255, 0, 0, 0); transition: background 0.25s ease; z-index: 1; }

.content { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 12px; align-items: center; }

.title { font-size: clamp(28px, 7vw, 48px); font-weight: 900; letter-spacing: 0.04em; }

.status { font-size: clamp(18px, 4vw, 26px); color: rgba(255,255,255,0.9); }

.hint { font-size: clamp(14px, 3.4vw, 18px); color: rgba(255,255,255,0.65); line-height: 1.6; }

.goods-lock { position: relative; z-index: 3; margin-top: 8px; font-size: clamp(42px, 11vw, 88px); font-weight: 900; color: #ff4b4b; text-shadow: 0 0 10px rgba(255, 30, 30, 0.8), 0 0 26px rgba(255, 40, 40, 0.7), 0 0 56px rgba(255, 30, 30, 0.5), 0 10px 24px rgba(0,0,0,0.45); opacity: 0; transform: scale(0.7); transition: opacity 0.18s ease; pointer-events: none; }

.chain-layer { position: absolute; inset: -10%; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.15s ease; }

.chain { position: absolute; left: 50%; top: 50%; width: 180vmax; height: 26px; margin-left: -90vmax; margin-top: -13px; border-radius: 999px; background: repeating-linear-gradient( 90deg, rgba(230,230,230,0.95) 0 18px, rgba(120,120,120,0.95) 18px 28px, rgba(230,230,230,0.95) 28px 46px, rgba(90,90,90,0.95) 46px 56px ); box-shadow: 0 0 12px rgba(255,255,255,0.15), 0 0 18px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.35); transform: scale(2.4); opacity: 0; }

.chain-1 { transform: translate(-50%, -50%) rotate(28deg) scale(2.4); } .chain-2 { transform: translate(-50%, -50%) rotate(-28deg) scale(2.4); } .chain-3 { transform: translate(-50%, -50%) rotate(78deg) scale(2.4); } .chain-4 { transform: translate(-50%, -50%) rotate(-78deg) scale(2.4); }

.locked::before { background: rgba(120, 0, 0, 0.28); }

.locked .chain-layer { opacity: 1; }

.locked .chain-1, .locked .chain-2, .locked .chain-3, .locked .chain-4 { animation: chainWrap 0.45s cubic-bezier(.17,1.2,.35,1) forwards; }

.locked .chain-2 { animation-delay: 0.05s; } .locked .chain-3 { animation-delay: 0.1s; } .locked .chain-4 { animation-delay: 0.15s; }

.locked .goods-lock { opacity: 1; animation: stamp 0.28s cubic-bezier(.2,1.8,.4,1) forwards, pulse 1.1s ease-in-out 0.35s infinite; }

@keyframes chainWrap { 0% { opacity: 0; filter: blur(8px); } 45% { opacity: 1; filter: blur(0); } 70% { opacity: 1; transform: var(--to) scale(0.94); } 100% { opacity: 1; filter: blur(0); transform: var(--to) scale(1); } }

@keyframes stamp { 0% { transform: scale(1.6); opacity: 0; } 55% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } } </style>

</head>
<body>
  <main id="screen" class="screen" aria-label="グッズロック画面">
    <div class="chain-layer" aria-hidden="true">
      <div class="chain chain-1" style="--to: translate(-50%, -50%) rotate(28deg);"></div>
      <div class="chain chain-2" style="--to: translate(-50%, -50%) rotate(-28deg);"></div>
      <div class="chain chain-3" style="--to: translate(-50%, -50%) rotate(78deg);"></div>
      <div class="chain chain-4" style="--to: translate(-50%, -50%) rotate(-78deg);"></div>
    </div><div class="content">
  <div class="title">グッズロックカウンター</div>
  <div id="status" class="status">状態：解除中</div>
  <div class="hint">画面をタップで切り替え</div>
  <div class="hint">1回タップでロック / もう1回タップで解除</div>
  <div class="goods-lock" aria-hidden="true">Goods Lock!!</div>
</div>

  </main><script>
  const screen = document.getElementById('screen');
  const statusText = document.getElementById('status');
  let isLocked = false;
  let audioContext = null;

  function getAudioContext() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
    return audioContext;
  }

  function playLockSound() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'square';
    osc1.frequency.setValueAtTime(220, now);
    osc1.frequency.exponentialRampToValueAtTime(70, now + 0.12);
    gain1.gain.setValueAtTime(0.001, now);
    gain1.gain.exponentialRampToValueAtTime(0.42, now + 0.015);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.start(now);
    osc1.stop(now + 0.2);

    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(620, now + 0.02);
    osc2.frequency.exponentialRampToValueAtTime(180, now + 0.09);
    gain2.gain.setValueAtTime(0.001, now + 0.02);
    gain2.gain.exponentialRampToValueAtTime(0.18, now + 0.03);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start(now + 0.02);
    osc2.stop(now + 0.11);
  }

  function playUnlockSound() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.linearRampToValueAtTime(320, now + 0.08);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  function lock() {
    isLocked = true;
    screen.classList.remove('locked');
    void screen.offsetWidth;
    screen.classList.add('locked');
    statusText.textContent = '状態：グッズロック中';
    playLockSound();
    if (navigator.vibrate) navigator.vibrate([70, 40, 90]);
  }

  function unlock() {
    isLocked = false;
    screen.classList.remove('locked');
    statusText.textContent = '状態：解除中';
    playUnlockSound();
    if (navigator.vibrate) navigator.vibrate(50);
  }

  function toggleLock() {
    if (isLocked) {
      unlock();
    } else {
      lock();
    }
  }

  screen.addEventListener('click', toggleLock);
</script></body>
</html>
