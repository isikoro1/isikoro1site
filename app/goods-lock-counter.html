<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>グッズロックカウンター</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: radial-gradient(circle at center, #2a2a2a 0%, #141414 62%, #0b0b0b 100%); color: #fff; }

body { position: relative; }

.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; cursor: pointer; user-select: none; overflow: hidden; background: radial-gradient(circle at center, rgba(255,255,255,0.025) 0%, rgba(0,0,0,0) 55%); }

.screen::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(160, 0, 0, 0) 0%, rgba(100, 0, 0, 0) 60%, rgba(60, 0, 0, 0) 100%); transition: opacity 0.22s ease; opacity: 0; z-index: 1; }

.screen::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.08); opacity: 0; transition: opacity 0.22s ease; z-index: 1; }

.content { position: relative; z-index: 4; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }

.title { font-size: clamp(28px, 7vw, 48px); font-weight: 900; letter-spacing: 0.04em; text-shadow: 0 6px 20px rgba(0,0,0,0.4); opacity: 0.92; }

.status { font-size: clamp(16px, 3.6vw, 22px); color: rgba(255,255,255,0.72); text-shadow: 0 4px 12px rgba(0,0,0,0.35); }

.goods-lock { position: relative; z-index: 4; margin-top: 8px; font-size: clamp(42px, 11vw, 88px); font-weight: 900; color: #ff4b4b; text-shadow: 0 0 10px rgba(255, 30, 30, 0.82), 0 0 26px rgba(255, 40, 40, 0.74), 0 0 56px rgba(255, 30, 30, 0.52), 0 10px 24px rgba(0,0,0,0.45); opacity: 0; transform: scale(0.7); transition: opacity 0.18s ease; pointer-events: none; }

.corner-hint { position: absolute; right: 10px; bottom: 8px; z-index: 5; font-size: 11px; color: rgba(255,255,255,0.16); letter-spacing: 0.05em; text-align: right; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,0.35); }

.vine-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }

.vine { position: absolute; opacity: 0; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.45)); }

.vine svg { width: 100%; height: 100%; overflow: visible; }

.vine path.main { fill: none; stroke: #1f5f22; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }

.vine path.shade { fill: none; stroke: #0f3412; stroke-width: 30; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }

.vine path.highlight { fill: none; stroke: #5fb24a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.62; }

.vine .leaf { fill: #48993a; stroke: #214f1f; stroke-width: 2; }

.vine.top-left { top: -8%; left: -10%; width: 64vw; height: 64vh; transform: scale(0.46) rotate(-22deg); }

.vine.top-right { top: -10%; right: -12%; width: 66vw; height: 64vh; transform: scale(0.46) rotate(28deg) scaleX(-1); }

.vine.bottom-left { left: -12%; bottom: -10%; width: 68vw; height: 62vh; transform: scale(0.44) rotate(22deg) scaleY(-1); }

.vine.bottom-right { right: -14%; bottom: -12%; width: 68vw; height: 66vh; transform: scale(0.44) rotate(-26deg) scale(-1); }

.vine.center-sweep { left: 50%; top: 50%; width: 110vw; height: 54vh; transform: translate(-50%, -50%) scale(0.3) rotate(-6deg); }

.locked::before { opacity: 1; }

.locked::after { opacity: 1; }

.locked .vine { opacity: 1; }

.locked .vine.top-left { animation: vineGrowTL 0.55s cubic-bezier(.18,1.15,.35,1) forwards; }

.locked .vine.top-right { animation: vineGrowTR 0.58s cubic-bezier(.18,1.15,.35,1) 0.03s forwards; }

.locked .vine.bottom-left { animation: vineGrowBL 0.62s cubic-bezier(.18,1.15,.35,1) 0.06s forwards; }

.locked .vine.bottom-right { animation: vineGrowBR 0.66s cubic-bezier(.18,1.15,.35,1) 0.09s forwards; }

.locked .vine.center-sweep { animation: vineSweep 0.52s cubic-bezier(.18,1.15,.35,1) 0.15s forwards; }

.locked .goods-lock { opacity: 1; animation: stamp 0.28s cubic-bezier(.2,1.8,.4,1) forwards, pulse 1.1s ease-in-out 0.35s infinite; }

@keyframes vineGrowTL { 0% { opacity: 0; transform: scale(0.08) rotate(-42deg) translate(-160px, -160px); } 55% { opacity: 1; transform: scale(0.62) rotate(-18deg) translate(10px, 8px); } 100% { opacity: 1; transform: scale(1) rotate(-22deg) translate(0, 0); } } 70% { opacity: 1; transform: scale(0.72) rotate(-10deg) translate(6px, 6px); } 100% { opacity: 1; transform: scale(1) rotate(-16deg) translate(0, 0); } }

@keyframes vineGrowTR { 0% { opacity: 0; transform: scale(0.08) rotate(46deg) scaleX(-1) translate(160px, -160px); } 55% { opacity: 1; transform: scale(0.64) rotate(22deg) scaleX(-1) translate(-10px, 8px); } 100% { opacity: 1; transform: scale(1) rotate(28deg) scaleX(-1) translate(0, 0); } } 70% { opacity: 1; transform: scale(0.74) rotate(18deg) scaleX(-1) translate(-6px, 6px); } 100% { opacity: 1; transform: scale(1) rotate(22deg) scaleX(-1) translate(0, 0); } }

@keyframes vineGrowBL { 0% { opacity: 0; transform: scale(0.08) rotate(36deg) scaleY(-1) translate(-160px, 160px); } 55% { opacity: 1; transform: scale(0.64) rotate(18deg) scaleY(-1) translate(8px, -10px); } 100% { opacity: 1; transform: scale(1) rotate(22deg) scaleY(-1) translate(0, 0); } } 70% { opacity: 1; transform: scale(0.76) rotate(12deg) scaleY(-1) translate(4px, -6px); } 100% { opacity: 1; transform: scale(1) rotate(16deg) scaleY(-1) translate(0, 0); } }

@keyframes vineGrowBR { 0% { opacity: 0; transform: scale(0.08) rotate(-42deg) scale(-1) translate(160px, 160px); } 55% { opacity: 1; transform: scale(0.66) rotate(-20deg) scale(-1) translate(-8px, -8px); } 100% { opacity: 1; transform: scale(1) rotate(-26deg) scale(-1) translate(0, 0); } } 70% { opacity: 1; transform: scale(0.78) rotate(-16deg) scale(-1) translate(-5px, -5px); } 100% { opacity: 1; transform: scale(1) rotate(-20deg) scale(-1) translate(0, 0); } }

@keyframes vineSweep { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.02) rotate(-14deg); } 60% { opacity: 1; transform: translate(-50%, -50%) scale(0.82) rotate(-4deg); } 100% { opacity: 0.98; transform: translate(-50%, -50%) scale(1) rotate(-6deg); } } 65% { opacity: 1; transform: translate(-50%, -50%) scale(0.9) rotate(-2deg); } 100% { opacity: 0.95; transform: translate(-50%, -50%) scale(1) rotate(-4deg); } }

@keyframes stamp { 0% { transform: scale(1.6); opacity: 0; } 55% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } } </style>

</head>
<body>
  <main id="screen" class="screen" aria-label="グッズロック画面">
    <div class="vine-layer" aria-hidden="true">
      <div class="vine top-left">
        <svg viewBox="0 0 400 400">
          <path class="shade" d="M20 40 C90 40, 120 120, 150 170 C190 235, 230 260, 300 290 C330 305, 350 335, 365 380"/>
          <path class="main" d="M20 40 C90 40, 120 120, 150 170 C190 235, 230 260, 300 290 C330 305, 350 335, 365 380"/>
          <path class="highlight" d="M28 44 C92 48, 122 126, 150 172 C188 232, 228 256, 296 288"/>
          <ellipse class="leaf" cx="105" cy="88" rx="16" ry="30" transform="rotate(-30 105 88)"/>
          <ellipse class="leaf" cx="155" cy="165" rx="15" ry="28" transform="rotate(28 155 165)"/>
          <ellipse class="leaf" cx="232" cy="243" rx="15" ry="29" transform="rotate(-32 232 243)"/>
          <ellipse class="leaf" cx="307" cy="306" rx="14" ry="26" transform="rotate(34 307 306)"/>
        </svg>
      </div><div class="vine top-right">
    <svg viewBox="0 0 400 400">
      <path class="shade" d="M20 55 C100 30, 140 110, 170 160 C205 220, 250 255, 308 295 C340 320, 360 350, 372 382"/>
      <path class="main" d="M20 55 C100 30, 140 110, 170 160 C205 220, 250 255, 308 295 C340 320, 360 350, 372 382"/>
      <path class="highlight" d="M28 60 C102 38, 141 116, 170 164 C203 218, 247 252, 304 292"/>
      <ellipse class="leaf" cx="112" cy="86" rx="16" ry="30" transform="rotate(-26 112 86)"/>
      <ellipse class="leaf" cx="176" cy="156" rx="16" ry="28" transform="rotate(32 176 156)"/>
      <ellipse class="leaf" cx="246" cy="238" rx="14" ry="28" transform="rotate(-36 246 238)"/>
      <ellipse class="leaf" cx="320" cy="310" rx="15" ry="28" transform="rotate(28 320 310)"/>
    </svg>
  </div>

  <div class="vine bottom-left">
    <svg viewBox="0 0 400 400">
      <path class="shade" d="M22 48 C95 52, 128 120, 158 175 C190 230, 234 262, 294 300 C332 322, 356 349, 372 380"/>
      <path class="main" d="M22 48 C95 52, 128 120, 158 175 C190 230, 234 262, 294 300 C332 322, 356 349, 372 380"/>
      <path class="highlight" d="M30 54 C95 56, 128 126, 158 176 C188 226, 232 258, 291 296"/>
      <ellipse class="leaf" cx="112" cy="94" rx="16" ry="30" transform="rotate(-22 112 94)"/>
      <ellipse class="leaf" cx="168" cy="177" rx="15" ry="29" transform="rotate(26 168 177)"/>
      <ellipse class="leaf" cx="244" cy="252" rx="14" ry="27" transform="rotate(-36 244 252)"/>
      <ellipse class="leaf" cx="313" cy="313" rx="15" ry="27" transform="rotate(34 313 313)"/>
    </svg>
  </div>

  <div class="vine bottom-right">
    <svg viewBox="0 0 400 400">
      <path class="shade" d="M24 52 C90 32, 132 110, 160 162 C196 226, 238 258, 302 299 C338 323, 360 350, 376 384"/>
      <path class="main" d="M24 52 C90 32, 132 110, 160 162 C196 226, 238 258, 302 299 C338 323, 360 350, 376 384"/>
      <path class="highlight" d="M30 58 C93 40, 134 115, 160 166 C194 224, 236 256, 298 296"/>
      <ellipse class="leaf" cx="102" cy="86" rx="16" ry="30" transform="rotate(-26 102 86)"/>
      <ellipse class="leaf" cx="163" cy="166" rx="16" ry="29" transform="rotate(28 163 166)"/>
      <ellipse class="leaf" cx="238" cy="246" rx="15" ry="28" transform="rotate(-34 238 246)"/>
      <ellipse class="leaf" cx="316" cy="315" rx="15" ry="28" transform="rotate(32 316 315)"/>
    </svg>
  </div>

  <div class="vine center-sweep">
    <svg viewBox="0 0 800 260">
      <path class="shade" d="M20 150 C110 80, 190 70, 280 120 C360 165, 430 180, 510 140 C590 102, 670 95, 780 135"/>
      <path class="main" d="M20 150 C110 80, 190 70, 280 120 C360 165, 430 180, 510 140 C590 102, 670 95, 780 135"/>
      <path class="highlight" d="M30 145 C116 85, 192 76, 276 122 C356 162, 430 176, 508 138 C585 104, 666 98, 770 132"/>
      <ellipse class="leaf" cx="132" cy="110" rx="16" ry="30" transform="rotate(-34 132 110)"/>
      <ellipse class="leaf" cx="246" cy="102" rx="15" ry="28" transform="rotate(28 246 102)"/>
      <ellipse class="leaf" cx="402" cy="164" rx="15" ry="29" transform="rotate(-26 402 164)"/>
      <ellipse class="leaf" cx="572" cy="118" rx="15" ry="28" transform="rotate(32 572 118)"/>
      <ellipse class="leaf" cx="680" cy="108" rx="14" ry="27" transform="rotate(-30 680 108)"/>
    </svg>
  </div>
</div>

<div class="content">
  <div class="title">グッズロックカウンター</div>
  <div id="status" class="status">解除中</div>
  <div class="goods-lock" aria-hidden="true">Goods Lock!!</div>
</div>

<div class="corner-hint">tap</div>

  </main><script>
  const screen = document.getElementById('screen');
  const statusText = document.getElementById('status');
  let isLocked = false;
  let audioContext = null;

  function getAudioContext() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
    return audioContext;
  }

  function playLockSound() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const master = ctx.createGain();
    master.gain.setValueAtTime(0.9, now);
    master.connect(ctx.destination);

    const bodyOsc = ctx.createOscillator();
    const bodyGain = ctx.createGain();
    bodyOsc.type = 'sawtooth';
    bodyOsc.frequency.setValueAtTime(140, now);
    bodyOsc.frequency.exponentialRampToValueAtTime(52, now + 0.22);
    bodyGain.gain.setValueAtTime(0.001, now);
    bodyGain.gain.exponentialRampToValueAtTime(0.55, now + 0.018);
    bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    bodyOsc.connect(bodyGain);
    bodyGain.connect(master);
    bodyOsc.start(now);
    bodyOsc.stop(now + 0.25);

    const impactOsc = ctx.createOscillator();
    const impactGain = ctx.createGain();
    impactOsc.type = 'square';
    impactOsc.frequency.setValueAtTime(520, now);
    impactOsc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
    impactGain.gain.setValueAtTime(0.001, now);
    impactGain.gain.exponentialRampToValueAtTime(0.28, now + 0.006);
    impactGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    impactOsc.connect(impactGain);
    impactGain.connect(master);
    impactOsc.start(now);
    impactOsc.stop(now + 0.1);

    const clangOsc = ctx.createOscillator();
    const clangGain = ctx.createGain();
    clangOsc.type = 'triangle';
    clangOsc.frequency.setValueAtTime(980, now + 0.012);
    clangOsc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
    clangGain.gain.setValueAtTime(0.001, now + 0.01);
    clangGain.gain.exponentialRampToValueAtTime(0.16, now + 0.022);
    clangGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    clangOsc.connect(clangGain);
    clangGain.connect(master);
    clangOsc.start(now + 0.01);
    clangOsc.stop(now + 0.17);
  }

  function playUnlockSound() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.linearRampToValueAtTime(320, now + 0.08);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  function lock() {
    isLocked = true;
    screen.classList.remove('locked');
    void screen.offsetWidth;
    screen.classList.add('locked');
    statusText.textContent = '状態：グッズロック中';
    playLockSound();
    if (navigator.vibrate) navigator.vibrate([70, 40, 90]);
  }

  function unlock() {
    isLocked = false;
    screen.classList.remove('locked');
    statusText.textContent = '状態：解除中';
    playUnlockSound();
    if (navigator.vibrate) navigator.vibrate(50);
  }

  function toggleLock() {
    if (isLocked) {
      unlock();
    } else {
      lock();
    }
  }

  screen.addEventListener('click', toggleLock);
</script></body>
</html>
