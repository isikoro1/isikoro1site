<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グッズロックカウンター</title>
<style>body{ margin:0; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background:#111; color:white; height:100vh; display:flex; align-items:center; justify-content:center; }

.app{ width:100%; max-width:420px; text-align:center; padding:24px; }

h1{ font-size:28px; margin-bottom:30px; }

button{ width:100%; padding:22px; font-size:22px; font-weight:bold; border:none; border-radius:16px; margin-bottom:16px; cursor:pointer; }

.lock{ background:#e11d48; color:white; }

.end{ background:#2563eb; color:white; }

.overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }

.stamp{ font-size:64px; font-weight:900; color:#ff2d55; text-shadow: 0 0 10px rgba(255,0,0,0.7), 0 0 30px rgba(255,0,0,0.6), 0 0 60px rgba(255,0,0,0.5); transform:scale(0); opacity:0; }

.overlay.active .stamp{ animation:stamp 0.35s cubic-bezier(.2,1.8,.4,1) forwards, pulse 1s ease-in-out 0.5s infinite; }

@keyframes stamp{ 0%{ transform:scale(3) rotate(-10deg); opacity:0; } 60%{ transform:scale(0.85) rotate(2deg); opacity:1; } 100%{ transform:scale(1) rotate(0deg); opacity:1; } }

@keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

.status{ margin-top:10px; margin-bottom:20px; font-size:18px; }

</style>
</head><body><div class="app"><h1>グッズロックカウンター</h1><div id="status" class="status">状態：解除中</div><button class="lock" onclick="startLock()">
グッズロックを受けた
</button><button class="end" onclick="endTurn()">
ターンエンド
</button></div><div id="overlay" class="overlay">
<div class="stamp">Goods Lock!!</div>
</div><script>

const overlay = document.getElementById("overlay")
const status = document.getElementById("status")

function playLockSound(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)()

  const osc = ctx.createOscillator()
  const gain = ctx.createGain()

  osc.type = "square"
  osc.frequency.setValueAtTime(180, ctx.currentTime)
  osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.15)

  gain.gain.setValueAtTime(0.4, ctx.currentTime)
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2)

  osc.connect(gain)
  gain.connect(ctx.destination)

  osc.start()
  osc.stop(ctx.currentTime + 0.2)
}

function startLock(){
  overlay.classList.add("active")
  playLockSound()
  status.textContent = "状態：グッズロック中"
}

function endTurn(){
  overlay.classList.remove("active")
  status.textContent = "状態：解除中"
}

</script></body>
</html>
