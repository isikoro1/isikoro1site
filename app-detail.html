<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アプリ詳細 | isikoro.dev</title>
    <meta name="description" content="isikoro.dev に掲載しているアプリの詳細ページです。" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand brand-mark" href="./index.html">isikoro.dev</a>
        </div>
    </nav>

    <main id="top">
        <section class="section-block section-dark top-apps-section">
            <div class="container">
                <div id="detail-root" class="app-detail-shell">
                    <p class="section-kicker">APP DETAIL</p>
                    <h1 class="app-site-title">読み込み中</h1>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <a href="./index.html" class="footer-brand">isikoro.dev</a>
            <div class="footer-links">
                <a href="./index.html">Apps</a>
                <a href="./archive.html">過去のアプリ</a>
                <a href="./about.html">開発者について</a>
            </div>
        </div>
    </footer>

    <script>
        (() => {
            const API_BASE = window.ISIKORO_API_BASE || "";
            const params = new URLSearchParams(location.search);
            const appId = params.get("id");
            const root = document.getElementById("detail-root");

            const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#39;"
            })[char]);

            const formatCount = (value) => Number(value || 0).toLocaleString("ja-JP");

            const apiFetch = async (path, options) => {
                if (!API_BASE) return null;
                try {
                    const response = await fetch(`${API_BASE}${path}`, options);
                    if (!response.ok) return null;
                    return await response.json();
                } catch (_) {
                    return null;
                }
            };

            const renderNotFound = () => {
                document.title = "アプリが見つかりません | isikoro.dev";
                root.innerHTML = `
                    <p class="section-kicker">APP DETAIL</p>
                    <h1 class="app-site-title">アプリが見つかりません</h1>
                    <p class="detail-lead">指定された詳細ページはまだ用意されていないか、URLが違います。</p>
                    <p class="archive-link text-start"><a href="./index.html">一覧に戻る</a></p>
                `;
            };

            const updateStats = (stats) => {
                if (!stats) return;
                document.querySelector("[data-stat='impressions']").textContent = formatCount(stats.impressions);
                document.querySelector("[data-stat='likes']").textContent = formatCount(stats.likes);
                document.querySelector("[data-stat='comments']").textContent = formatCount(stats.comments);
                document.querySelector("[data-stat='shares']").textContent = formatCount(stats.shares);
            };

            const renderComments = (comments) => {
                const list = document.getElementById("comment-list");
                if (!list || !comments || comments.length === 0) return;
                list.innerHTML = comments.map((comment) => `
                    <article class="comment-item">
                        <strong>${escapeHtml(comment.author_name || "anonymous")}</strong>
                        <p>${escapeHtml(comment.body)}</p>
                    </article>
                `).join("");
            };

            const load = async () => {
                const response = await fetch("./data/apps.json");
                const apps = await response.json();
                const app = apps.find((item) => item.id === appId);

                if (!app) {
                    renderNotFound();
                    return;
                }

                document.title = `${app.title} | isikoro.dev`;
                const detailUrl = `${location.origin}${location.pathname}?id=${encodeURIComponent(app.id)}`;
                const highlights = (app.highlights || []).map((item) => `<span>${escapeHtml(item)}</span>`).join("");
                const imageHtml = app.image
                    ? `<img src="${escapeHtml(app.image)}" alt="${escapeHtml(app.title)}の画面" class="detail-image" />`
                    : `<div class="work-placeholder shorts-theme detail-placeholder"><span>${escapeHtml(app.title)}</span></div>`;

                root.innerHTML = `
                    <div class="detail-hero">
                        <div class="detail-copy">
                            <p class="section-kicker">${escapeHtml(app.category)}</p>
                            <h1 class="app-site-title">${escapeHtml(app.title)}</h1>
                            <p class="detail-lead">${escapeHtml(app.detail || app.summary)}</p>
                            <div class="work-meta">
                                <span class="work-badge">${escapeHtml(app.badge)}</span>
                                <span class="work-stack">${escapeHtml(app.stack)}</span>
                            </div>
                            <div class="detail-actions">
                                <a class="btn btn-main" href="${escapeHtml(app.url)}" target="_blank" rel="noopener noreferrer">公開ページ</a>
                                <button class="btn btn-sub" type="button" id="share-button">共有</button>
                            </div>
                        </div>
                        <div>${imageHtml}</div>
                    </div>

                    <div class="detail-grid">
                        <section class="detail-panel">
                            <h2>概要</h2>
                            <p>${escapeHtml(app.summary)}</p>
                            <div class="detail-tags">${highlights}</div>
                        </section>

                        <section class="detail-panel">
                            <h2>リアクション</h2>
                            <div class="stats-grid">
                                <div><strong data-stat="impressions">0</strong><span>表示</span></div>
                                <div><strong data-stat="likes">0</strong><span>いいね</span></div>
                                <div><strong data-stat="comments">0</strong><span>コメント</span></div>
                                <div><strong data-stat="shares">0</strong><span>共有</span></div>
                            </div>
                            <button class="btn btn-main detail-like-button" type="button" id="like-button">いいね</button>
                        </section>

                        <section class="detail-panel detail-comments">
                            <h2>コメント</h2>
                            <form id="comment-form" class="comment-form">
                                <input name="authorName" type="text" maxlength="40" placeholder="名前" />
                                <textarea name="body" maxlength="800" rows="4" placeholder="コメント"></textarea>
                                <button class="btn btn-sub" type="submit">送信</button>
                            </form>
                            <div id="comment-list" class="comment-list">
                                <p class="muted-text">コメントAPIを接続するとここに表示されます。</p>
                            </div>
                        </section>
                    </div>

                    <p class="archive-link text-start"><a href="./index.html">一覧に戻る</a></p>
                `;

                await apiFetch(`/apps/${encodeURIComponent(app.id)}/impressions`, { method: "POST" });
                updateStats(await apiFetch(`/apps/${encodeURIComponent(app.id)}/stats`));
                renderComments(await apiFetch(`/apps/${encodeURIComponent(app.id)}/comments`));

                document.getElementById("like-button").addEventListener("click", async () => {
                    const stats = await apiFetch(`/apps/${encodeURIComponent(app.id)}/likes`, { method: "POST" });
                    updateStats(stats);
                });

                document.getElementById("share-button").addEventListener("click", async () => {
                    if (navigator.share) {
                        await navigator.share({ title: app.title, text: app.summary, url: detailUrl });
                    } else {
                        await navigator.clipboard.writeText(detailUrl);
                    }
                    const stats = await apiFetch(`/apps/${encodeURIComponent(app.id)}/shares`, { method: "POST" });
                    updateStats(stats);
                });

                document.getElementById("comment-form").addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const form = new FormData(event.currentTarget);
                    const body = String(form.get("body") || "").trim();
                    if (!body) return;
                    await apiFetch(`/apps/${encodeURIComponent(app.id)}/comments`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            authorName: String(form.get("authorName") || "").trim(),
                            body
                        })
                    });
                    event.currentTarget.reset();
                    updateStats(await apiFetch(`/apps/${encodeURIComponent(app.id)}/stats`));
                    renderComments(await apiFetch(`/apps/${encodeURIComponent(app.id)}/comments`));
                });
            };

            load().catch(renderNotFound);
        })();
    </script>
</body>

</html>
